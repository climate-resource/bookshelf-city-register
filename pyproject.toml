[project]
name = "bookshelf-city-register"
version = "0.1.0"
description = "Canonical register of cities, built on GHS-UCDB R2024A, that city-level datasets key on."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bookshelf[publish]==1.0.0b14",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pycountry>=26.2.16",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { bookshelf = false }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "pytest>=9.1.1",
]
